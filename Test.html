<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="box">
    <span class="btn" onclick="k()">=</span>
    <span>ทดสอบ</span>
  </div>
  <div id="menu" style="display: none;">
    <a href="#">ทดสอบ</a>
  </div>
</body>
  <style>

    .btn{cursor:pointer;}
    .box{padding:28px;font-size:38px;background-color: pink;color:blue;}
  </style>
  <script>
    function k(){
      var menu = document.getElementById("menu");
      if(menu.style.display == "none"){
        menu.style.display = "block";
      } else {
        menu.style.display = "none";
      }
      }
  </script>
</html>
